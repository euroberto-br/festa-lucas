<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Malucão mascote do Mussa">
  <rect width="300" height="300" fill="#FFE2C8"/>
  <circle cx="150" cy="150" r="120" fill="#FF7A1A" opacity=".2"/>
  <g transform="translate(150,168)">
    <!-- Orelhas caídas -->
    <ellipse cx="-66" cy="-14" rx="26" ry="52" transform="rotate(14 -66 -14)" fill="#8B5A2B" stroke="#181826" stroke-width="7"/>
    <ellipse cx="66" cy="-14" rx="26" ry="52" transform="rotate(-14 66 -14)" fill="#8B5A2B" stroke="#181826" stroke-width="7"/>
    <!-- Corpo + coleira dourada -->
    <path d="M-66 116 C-62 66 -34 48 0 48 C34 48 62 66 66 116 Z" fill="#C98744" stroke="#181826" stroke-width="7"/>
    <rect x="-46" y="42" width="92" height="20" rx="10" fill="#E62E2D" stroke="#181826" stroke-width="5"/>
    <circle cx="0" cy="68" r="16" fill="#FFD23F" stroke="#181826" stroke-width="5"/>
    <!-- Cabeça -->
    <ellipse cx="0" cy="-22" rx="64" ry="58" fill="#C98744" stroke="#181826" stroke-width="7"/>
    <!-- Focinho -->
    <ellipse cx="0" cy="6" rx="34" ry="24" fill="#F6D5A9" stroke="#181826" stroke-width="5"/>
    <ellipse cx="0" cy="-2" rx="15" ry="10" fill="#181826"/>
    <!-- Língua feliz -->
    <path d="M-10 18 Q0 38 10 18 Z" fill="#F44E8B" stroke="#181826" stroke-width="4"/>
    <!-- Óculos escuros estilosos -->
    <rect x="-54" y="-44" width="46" height="28" rx="9" fill="#181826" stroke="#FFD23F" stroke-width="5"/>
    <rect x="8" y="-44" width="46" height="28" rx="9" fill="#181826" stroke="#FFD23F" stroke-width="5"/>
    <line x1="-8" y1="-32" x2="8" y2="-32" stroke="#FFD23F" stroke-width="5"/>
  </g>
</svg>
