<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Avatar comemorativo do Lucas Nery - 7 anos">
  <defs>
    <radialGradient id="g" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE478"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="url(#g)"/>
  <!-- Raios de estrela -->
  <g fill="#FFFFFF" opacity=".18">
    <polygon points="160,160 120,0 200,0"/>
    <polygon points="160,160 320,120 320,200"/>
    <polygon points="160,160 120,320 200,320"/>
    <polygon points="160,160 0,120 0,200"/>
  </g>
  <!-- Boné vermelho estilizado -->
  <path d="M90 126 C96 64 224 64 230 126 Z" fill="#E62E2D" stroke="#181826" stroke-width="8"/>
  <path d="M210 112 L268 122 C270 134 258 142 244 140 L216 130 Z" fill="#B31B1B" stroke="#181826" stroke-width="7"/>
  <!-- Óculos escuros -->
  <rect x="94" y="140" width="58" height="34" rx="11" fill="#181826" stroke="#FFFFFF" stroke-width="5"/>
  <rect x="168" y="140" width="58" height="34" rx="11" fill="#181826" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="152" y1="154" x2="168" y2="154" stroke="#FFFFFF" stroke-width="6"/>
  <!-- Nome e idade -->
  <rect x="44" y="198" width="232" height="58" rx="29" fill="#181826" stroke="#FFFFFF" stroke-width="5"/>
  <text x="160" y="236" text-anchor="middle" font-family="'Baloo 2', Arial, sans-serif" font-weight="800" font-size="32" fill="#FFD23F">LUCAS • 7</text>
  <text x="160" y="286" text-anchor="middle" font-family="'Nunito', Arial, sans-serif" font-weight="800" font-size="16" fill="#181826">Troque por img/lucas.jpg</text>
