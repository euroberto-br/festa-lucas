<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#140928">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>🧠 Quiz do Lucas — Lucas Nery faz 7! 🎤</title>
<meta name="description" content="Quem conhece melhor o Lucas? 7 perguntas sobre o aniversariante de 7 anos valendo pontos no Ranking da Tropa!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tema-mussa.css">
<style>
body{min-height:100svh;padding-bottom:4rem}
.wrap{max-width:740px;margin:0 auto;padding:0 1.1rem}
.quiz-card{padding:1.9rem 1.45rem;border-color:var(--ouro)}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;font-family:var(--display);font-weight:800;color:var(--ouro)}
.prog-bar{height:10px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-bottom:1.3rem}
.prog-bar > span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ouro),var(--laranja));transition:width .3s ease}
.pergunta-txt{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,5.2vw,1.8rem);line-height:1.18;margin-bottom:1.25rem;color:var(--branco)}
.opcoes{display:grid;gap:.7rem}
.opcao-btn{
  text-align:left;font-family:var(--texto);font-weight:800;font-size:1rem;
  color:var(--creme);background:rgba(12,10,24,.82);
  border:2.5px solid rgba(255,210,63,.5);border-radius:18px;padding:.85rem 1.05rem;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.opcao-btn:hover:not([disabled]){transform:translateY(-2px);border-color:var(--ouro);background:rgba(46,24,78,.9)}
.opcao-btn.certa{background:rgba(62,201,107,.28);border-color:var(--verde);color:#fff}
.opcao-btn.errada{background:rgba(230,46,45,.28);border-color:var(--vermelho);color:#fff}
.feedback{margin-top:1rem;font-weight:800;min-height:1.6rem;text-align:center;color:var(--ouro)}
.resultado-box{text-align:center;display:none}
.resultado-box.ativo{display:block}
.nota-grande{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,10vw,3.6rem);color:var(--ouro);line-height:1;margin:.5rem 0}
.campo-nome{
  width:min(320px,100%);font-family:var(--texto);font-size:1rem;font-weight:800;
  color:var(--branco);background:rgba(12,10,24,.85);
  border:2.5px solid var(--ouro);border-radius:14px;padding:.65rem .95rem;text-align:center;margin:.9rem 0;
}
</style>
</head>
<body>
<header class="topo">
  <a class="voltar" href="index.html?festa=1">← Central da Festa</a>
  <nav class="nav-mini" aria-label="Outras páginas da festa">
    <a href="cardapio.html">🍽️ Cardápio</a>
    <a href="jogos.html">🎮 Jogos</a>
    <a href="fotos.html">📸 Fotos</a>
    <a href="mussa.html">🎨 Mussaverso IA</a>
    <a href="capsula.html">📼 Cápsula</a>
  </nav>
</header>

<section class="hero-pag">
  <p style="font-family:var(--display);font-weight:800;color:var(--ouro);letter-spacing:.08em">DESAFIO DA TROPA · 7 PERGUNTAS</p>
  <h1>🧠 Quiz do Lucas!</h1>
  <p>Será que você conhece bem o aniversariante? Responda às 7 perguntas e entre no Ranking da Tropa!</p>
</section>

<main class="wrap">
  <section class="stage-card quiz-card" id="boxQuiz">
    <div id="telaPergunta">
      <div class="quiz-meta">
        <span id="txtPasso">Pergunta 1 de 7</span>
        <span id="txtPontos">0 pts</span>
      </div>
      <div class="prog-bar"><span id="progFill"></span></div>
      <h2 class="pergunta-txt" id="txtPergunta"></h2>
      <div class="opcoes" id="boxOpcoes"></div>
      <p class="feedback" id="txtFeedback" aria-live="polite"></p>
    </div>

    <div class="resultado-box" id="telaResultado">
      <div style="font-size:3.2rem" id="resEmoji">🏆🎤</div>
      <h2 id="resTitulo" style="font-family:var(--display);font-weight:800;font-size:1.9rem;color:var(--branco)"></h2>
      <div class="nota-grande" id="resPts">0 pts</div>
      <p id="resResumo" style="font-weight:700;color:var(--creme)"></p>
      <div>
        <input class="campo-nome" id="inNomeQuiz" type="text" maxlength="40" placeholder="Seu nome para o Ranking...">
      </div>
      <div style="display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem">
        <button class="cta cta--capsula" id="btnSalvarRank" type="button">Salvar no Ranking 🏆</button>
        <button class="cta" id="btnJogarNovo" type="button">Jogar novamente ↺</button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  // Edite facilmente as 7 perguntas abaixo se quiser colocar curiosidades extras da família!
  var PERGUNTAS = [
    {
      q: '1. Quantos anos o Lucas Nery está completando hoje? 🎂',
      opcoes: ['5 anos', '6 anos', '7 anos', '8 anos'],
      correta: 2,
      dica: '7 velas no bolo e 7 microfones dourados no palco!'
    },
    {
      q: '2. Qual é o tema oficial da festa do Lucas? 🎤',
      opcoes: ['Super-Heróis', 'YouTuber Mussa (Mussa Style)', 'Dinossauros', 'Espaço Sideral'],
      correta: 1,
      dica: 'Pano na cabeça, bonézin pra trás — é o Lucas Style!'
    },
    {
      q: '3. Na música tema da festa, qual sinalzinho a tropa faz com a mão? 🤙',
      opcoes: ['Sinalzinho do L (de Lucas!)', 'Sinalzinho do V', 'Sinalzinho do P', 'Sinalzinho do Z'],
      correta: 0,
      dica: 'Faz o sinalzinho do L, L de Lucas!'
    },
    {
      q: '4. Qual é o sabor do Bolo Gran Finale da festa? 🍰',
      opcoes: ['Bolo de cenoura', 'Bolo Belga com brigadeiro', 'Torta de limão', 'Bolo de fubá'],
      correta: 1,
      dica: 'Bolo Belga com 7 velas acesas no gran finale!'
    },
    {
      q: '5. Em frente a qual parque famoso de São Paulo fica o Guimi Buffet? 🌳',
      opcoes: ['Parque Ibirapuera', 'Parque Villa-Lobos', 'Parque da Aclimação', 'Parque da Independência'],
      correta: 2,
      dica: 'Rua Muniz de Souza, 1130 — em frente ao Parque da Aclimação!'
    },
    {
      q: '6. Quantos jogos existem na Arena Arcade do site da festa? 🎮',
      opcoes: ['2 jogos', '3 jogos', '4 jogos', '6 jogos'],
      correta: 2,
      dica: 'Mussa Surf, Lucas Dash, Voo do Mic e Batalha Hero!'
    },
    {
      q: '7. Em que dia comemoramos os 7 anos do Lucas Nery? 📅',
      opcoes: ['12/12/2026', '25/12/2026', '01/12/2026', '15/11/2026'],
      correta: 0,
      dica: 'Sábado, 12/12/2026 às 13:00 — show inesquecível!'
    }
  ];

  var idx = 0, acertos = 0, pontos = 0, inicioP = 0, travado = false;
  var telaPergunta = document.getElementById('telaPergunta');
  var telaResultado = document.getElementById('telaResultado');
  var txtPasso = document.getElementById('txtPasso');
  var txtPontos = document.getElementById('txtPontos');
  var progFill = document.getElementById('progFill');
  var txtPergunta = document.getElementById('txtPergunta');
  var boxOpcoes = document.getElementById('boxOpcoes');
  var txtFeedback = document.getElementById('txtFeedback');
  var inNome = document.getElementById('inNomeQuiz');
  var btnSalvar = document.getElementById('btnSalvarRank');
  var toast = document.getElementById('toast');
  var tm = null;

  try { inNome.value = localStorage.getItem('festa-lucas-nome') || ''; } catch (e) {}

  function mostraToast(msg) {
    toast.textContent = msg;
    toast.classList.add('mostra');
    if (tm) clearTimeout(tm);
    tm = setTimeout(function () { toast.classList.remove('mostra'); }, 3000);
  }

  function renderPergunta() {
    travado = false;
    var p = PERGUNTAS[idx];
    txtPasso.textContent = 'Pergunta ' + (idx + 1) + ' de ' + PERGUNTAS.length;
    txtPontos.textContent = pontos + ' pts';
    progFill.style.width = Math.round((idx / PERGUNTAS.length) * 100) + '%';
    txtPergunta.textContent = p.q;
    txtFeedback.textContent = '';
    boxOpcoes.innerHTML = '';
    inicioP = performance.now();

    p.opcoes.forEach(function (op, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opcao-btn';
      b.textContent = op;
      b.addEventListener('click', function () { responde(i, b); });
      boxOpcoes.appendChild(b);
    });
  }

  function responde(i, btn) {
    if (travado) return;
    travado = true;
    var p = PERGUNTAS[idx];
    var btns = boxOpcoes.querySelectorAll('.opcao-btn');
    btns.forEach(function (b) { b.disabled = true; });
    btns[p.correta].classList.add('certa');

    if (i === p.correta) {
      acertos++;
      var seg = (performance.now() - inicioP) / 1000;
      var ganho = 100 + Math.max(0, Math.round(50 - seg * 5));
      pontos += ganho;
      txtPontos.textContent = pontos + ' pts';
      txtFeedback.textContent = '✅ Mandou bem! +' + ganho + ' pts — ' + p.dica;
    } else {
      btn.classList.add('errada');
      txtFeedback.textContent = '😅 Quase! ' + p.dica;
    }

    setTimeout(function () {
      idx++;
      if (idx < PERGUNTAS.length) renderPergunta();
      else mostraFinal();
    }, 1500);
  }

  function mostraFinal() {
    progFill.style.width = '100%';
    telaPergunta.style.display = 'none';
    telaResultado.classList.add('ativo');
    document.getElementById('resPts').textContent = pontos + ' pts';
    var titulo = acertos === 7 ? 'Sócio VIP da Tropa do L! 👑' :
                 acertos >= 5 ? 'Fã de Carteirinha do Lucas! 🔥' :
                 acertos >= 3 ? 'Convidado Animado! 🎉' : 'Hora de curtir a festa pra conhecer mais! 😄';
    document.getElementById('resTitulo').textContent = titulo;
    document.getElementById('resResumo').textContent = 'Você acertou ' + acertos + ' de ' + PERGUNTAS.length + ' perguntas!';
    btnSalvar.disabled = false;
    btnSalvar.textContent = 'Salvar no Ranking 🏆';
  }

  btnSalvar.addEventListener('click', function () {
    var nome = inNome.value.trim();
    if (!nome) { mostraToast('Digite seu nome para salvar no ranking! 🏆'); inNome.focus(); return; }
    try { localStorage.setItem('festa-lucas-nome', nome); } catch (e) {}
    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Salvando...';
    fetch('/api/ranking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome: nome, jogo: 'runner', pontos: pontos })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok) {
        btnSalvar.textContent = 'Salvo no Ranking! ✅';
        mostraToast('🏆 Pontuação enviada para o Telão da Tropa!');
      } else {
        btnSalvar.disabled = false;
        btnSalvar.textContent = 'Salvar no Ranking 🏆';
        mostraToast('Não foi possível salvar agora.');
      }
    }).catch(function () {
      btnSalvar.disabled = false;
      btnSalvar.textContent = 'Salvar no Ranking 🏆';
      mostraToast('Erro de conexão.');
    });
  });

  document.getElementById('btnJogarNovo').addEventListener('click', function () {
    idx = 0; acertos = 0; pontos = 0;
    telaResultado.classList.remove('ativo');
    telaPergunta.style.display = 'block';
    renderPergunta();
  });

  renderPergunta();
})();
</script>
<script src="js/palco-bg.js"></script>
<script src="js/musica.js"></script>
</body>
</html>
