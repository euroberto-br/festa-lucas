<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#151524">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>🏆 Telão — Ranking da Tropa · Lucas Nery 7 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tema-mussa.css">
<style>
body{
  min-height:100svh;display:flex;flex-direction:column;
  color:var(--branco);padding:1.4rem 1.8rem;
  background:#110822;
}
.head{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  max-width:1200px;width:100%;margin:0 auto 1.2rem;
}
.head h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(1.8rem,4.5vw,3.1rem);color:var(--ouro);
  text-shadow:0 4px 0 var(--grafite-escuro);
}
.badge-vista{
  font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,2.4vw,1.6rem);
  background:var(--vermelho);color:var(--branco);
  border:4px solid var(--ouro);border-radius:99px;padding:.35rem 1.4rem;
  box-shadow:0 6px 0 var(--grafite-escuro);
}
.painel{
  flex:1;max-width:1200px;width:100%;margin:0 auto;
  background:linear-gradient(160deg, rgba(32,22,56,.88), rgba(16,14,32,.94));
  border:3.5px solid rgba(255,210,63,.7);
  border-radius:32px;padding:1.4rem 1.6rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 18px 46px rgba(0,0,0,.55), 0 0 36px rgba(255,210,63,.16);
}
.lista{list-style:none;display:grid;gap:.7rem}
.linha{
  display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:1rem;
  background:rgba(21,21,36,.86);border:3px solid rgba(255,255,255,.16);
  border-radius:18px;padding:.7rem 1.2rem;
  font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,2.5vw,1.65rem);
}
.linha:nth-child(1){background:linear-gradient(90deg,rgba(255,210,63,.28),rgba(21,21,36,.9));border-color:var(--ouro)}
.linha:nth-child(2){border-color:#D9E2EC}
.linha:nth-child(3){border-color:#F49B33}
.pos{text-align:center;color:var(--ouro)}
.pts{color:var(--ouro);white-space:nowrap}
.vazio{
  text-align:center;padding:3rem 1rem;font-family:var(--display);
  font-weight:800;font-size:1.4rem;color:var(--ouro);
}
.rodape{
  max-width:1200px;width:100%;margin:1rem auto 0;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;
  font-weight:800;opacity:.82;font-size:.95rem;
}
.dots{display:flex;gap:.5rem}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.28)}
.dot.ativo{background:var(--ouro);transform:scale(1.25)}

/* Galeria ao vivo no Telão + QR Code fixo */
.telao-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.telao-foto{
  background:rgba(16,12,32,.92);border:3px solid var(--ouro);border-radius:20px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.telao-foto img{width:100%;aspect-ratio:1;object-fit:cover}
.telao-foto span{
  display:block;padding:.45rem .7rem;font-family:var(--display);font-weight:800;font-size:.95rem;
  color:var(--ouro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.qr-telao{
  position:fixed;right:18px;bottom:84px;z-index:50;
  background:rgba(20,14,38,.94);border:3px solid var(--ouro);border-radius:18px;
  padding:.55rem;text-align:center;width:138px;
  box-shadow:0 10px 28px rgba(0,0,0,.6);
}
.qr-telao img{width:112px;height:112px;border-radius:10px;background:#fff;padding:4px;margin:0 auto .35rem}
.qr-telao span{display:block;font-family:var(--display);font-weight:800;font-size:.76rem;line-height:1.15;color:var(--ouro)}
@media (max-width:700px){.qr-telao{display:none}}
</style>
</head>
<body>
<header class="head">
  <h1>🏆 Telão do Show · Lucas 7!</h1>
  <span class="badge-vista" id="tituloVista">🏆 Ranking Geral</span>
</header>

<main class="painel">
  <ol class="lista" id="listaRanking">
    <li class="vazio">Carregando o placar da Arena de Jogos... 🎤</li>
  </ol>
  <div class="telao-fotos" id="gradeTelao" hidden></div>
</main>

<aside class="qr-telao" aria-label="QR Code para participar pelo celular">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=4&data=https%3A%2F%2Ffestalucas.roberto.inf.br" alt="QR Code festalucas.roberto.inf.br">
  <span>📱 Escaneie e apareça no telão!</span>
</aside>

<footer class="rodape">
  <span>Jogue, envie fotos ou vire cartoon IA pelo celular e apareça no telão! 🎮📸🎨</span>
  <div class="dots" id="dots" aria-hidden="true"></div>
</footer>

<script>
(function () {
  'use strict';
  var API_URL = '/api/ranking';
  var CLOUD_BASE = 'https://res.cloudinary.com/znbneca7/image/upload/w_520,h_520,c_fill,q_auto,f_auto/';
  var apiOk = true;

  var VISTAS = [
    { chave: 'geral', tipo: 'rank', titulo: '🏆 Ranking Geral' },
    { chave: 'fotos', tipo: 'fotos', titulo: '📸 Fotos dos Inscritos — Ao Vivo!' },
    { chave: 'runner', tipo: 'rank', titulo: '🏃 Mussa Surf' },
    { chave: 'ia', tipo: 'ia', titulo: '🎨 Mural do Mussaverso IA' },
    { chave: 'sonic', tipo: 'rank', titulo: '💨 Lucas Dash' },
    { chave: 'flappy', tipo: 'rank', titulo: '🚀 Voo do Mic' },
    { chave: 'ritmo', tipo: 'rank', titulo: '🎸 Batalha Hero' }
  ];
  var dados = { geral: [], porJogo: { runner: [], sonic: [], flappy: [], ritmo: [] } };
  var fotosLista = [];
  var iaLista = [];
  var idx = 0;

  var lista = document.getElementById('listaRanking');
  var gradeTelao = document.getElementById('gradeTelao');
  var tituloVista = document.getElementById('tituloVista');
  var dots = document.getElementById('dots');

  function desenhaDots() {
    dots.innerHTML = '';
    VISTAS.forEach(function (_, i) {
      var s = document.createElement('span');
      s.className = 'dot' + (i === idx ? ' ativo' : '');
      dots.appendChild(s);
    });
  }

  function renderGaleria(itens, vazioMsg) {
    lista.hidden = true;
    gradeTelao.hidden = false;
    if (!itens.length) {
      gradeTelao.innerHTML = '<div class="vazio" style="grid-column:1/-1">' + vazioMsg + '</div>';
      return;
    }
    gradeTelao.innerHTML = itens.slice(0, 8).map(function (f) {
      var ver = f.version ? 'v' + f.version + '/' : '';
      var src = f.url || (CLOUD_BASE + ver + f.public_id + '.jpg');
      var autor = String(f.autor || 'Tropa do Lucas').replace(/</g, '&lt;');
      return '<div class="telao-foto"><img src="' + src + '" alt="' + autor + '"><span>' + autor + '</span></div>';
    }).join('');
  }

  function render() {
    var v = VISTAS[idx];
    tituloVista.textContent = v.titulo;
    desenhaDots();

    if (v.tipo === 'fotos') {
      renderGaleria(fotosLista, 'Escaneie o QR Code e mande a primeira foto da festa! 📸');
      return;
    }
    if (v.tipo === 'ia') {
      renderGaleria(iaLista, 'Escaneie o QR Code e crie seu personagem no Mussaverso IA! 🎨');
      return;
    }

    gradeTelao.hidden = true;
    lista.hidden = false;

    if (!apiOk) {
      lista.innerHTML = '<li class="vazio">Conecte o Supabase nas variáveis da Vercel 🛠️</li>';
      return;
    }

    var itens = v.chave === 'geral' ? (dados.geral || []) : ((dados.porJogo && dados.porJogo[v.chave]) || []);
    if (!itens.length) {
      lista.innerHTML = '<li class="vazio">Nenhum placar ainda nesta categoria — bora jogar na Arena de Jogos! 🎤</li>';
      return;
    }

    lista.innerHTML = '';
    var medalhas = ['🥇', '🥈', '🥉'];
    itens.forEach(function (item, i) {
      var li = document.createElement('li');
      li.className = 'linha';
      var valor = v.chave === 'geral'
        ? (item.total + ' pts')
        : (item.pontos + ' pts' + (item.detalhe ? ' (' + item.detalhe + ')' : ''));
      li.innerHTML =
        '<span class="pos">' + (medalhas[i] || (i + 1) + 'º') + '</span>' +
        '<span>' + String(item.nome || '').replace(/</g, '&lt;') + '</span>' +
        '<span class="pts">' + valor + '</span>';
      lista.appendChild(li);
    });
  }

  function busca() {
    fetch(API_URL + '?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (d) {
        if (d && d.ok) { apiOk = true; dados = d; render(); }
        else { apiOk = false; render(); }
      })
      .catch(function () { apiOk = false; render(); });

    fetch('/api/galeria?pasta=festa_lucas&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok && Array.isArray(d.fotos)) fotosLista = d.fotos; })
      .catch(function () {});

    fetch('/api/galeria?pasta=festa_lucas_ia&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok && Array.isArray(d.fotos)) iaLista = d.fotos; })
      .catch(function () {});
  }

  busca();
  setInterval(busca, 25000);
  setInterval(function () { idx = (idx + 1) % VISTAS.length; render(); }, 12000);
})();
</script>
<script src="js/palco-bg.js"></script>
<script src="js/musica.js"></script>
</body>
</html>
