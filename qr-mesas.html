<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>🖨️ Cartões de Mesa com QR Code — Festa Lucas Nery 7 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#110822;color:#fff;padding:1.2rem}
.barra-print{
  max-width:900px;margin:0 auto 1.2rem;display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;
  background:rgba(32,22,56,.92);border:3px solid #FFD23F;border-radius:18px;padding:.85rem 1.1rem;
}
.btn-p{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;
  background:#FFD23F;color:#181826;border:3px solid #181826;border-radius:99px;padding:.45rem 1.2rem;
}
.folha{
  width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:10mm;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8mm;
  box-shadow:0 16px 46px rgba(0,0,0,.55);
}
.cartao{
  border:3px dashed #888;border-radius:16px;padding:8mm 6mm;
  background:linear-gradient(160deg,#1B0A36 0%,#46156B 55%,#78173A 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.c-tag{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11pt;
  background:#FFD23F;color:#181826;border:2px solid #181826;border-radius:99px;padding:2px 14px;
}
.c-tit{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:21pt;line-height:1.02;color:#FFD23F;margin-top:3mm}
.c-sub{font-size:10pt;font-weight:800;color:#FFFDF7;margin:2mm 0 3mm}
.qr-box{background:#fff;padding:4mm;border-radius:14px;border:4px solid #FFD23F;display:inline-block}
.qr-box img{width:46mm;height:46mm;display:block}
.c-lista{font-size:9.5pt;font-weight:800;line-height:1.45;color:#FFF7D6;margin-top:3mm}
.c-url{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:10pt;color:#FFD23F;margin-top:2mm}

@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff;padding:0}
  .barra-print{display:none}
  .folha{box-shadow:none;margin:0}
}
</style>
</head>
<body>
<div class="barra-print">
  <div>
    <strong style="font-family:'Baloo 2',sans-serif;font-size:1.15rem;color:#FFD23F">🖨️ Cartões de Mesa — A4 (4 totens por folha)</strong>
    <div style="font-size:.86rem;opacity:.9">Ative "Gráficos de plano de fundo" ao imprimir ou salvar em PDF.</div>
  </div>
  <div style="display:flex;gap:.5rem">
    <a class="btn-p" href="painel-rsvp-7k9m2x.html" style="background:#1CC6E8">← Painel</a>
    <button class="btn-p" type="button" onclick="window.print()">🖨️ Imprimir / PDF</button>
  </div>
</div>

<main class="folha" id="folha"></main>

<script>
(function () {
  var SITE = 'https://festalucas.roberto.inf.br';
  var QR_SRC = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=6&data=' + encodeURIComponent(SITE);
  var html = '';
  for (var i = 0; i < 4; i++) {
    html +=
      '<article class="cartao">' +
        '<span class="c-tag">🎤 MUSSA STYLE · 7 ANOS</span>' +
        '<h1 class="c-tit">Lucas Nery faz 7!</h1>' +
        '<p class="c-sub">Aponte a câmera do celular e entre no show:</p>' +
        '<div class="qr-box"><img src="' + QR_SRC + '" alt="QR Code do site da festa"></div>' +
        '<p class="c-lista">🍽️ Cardápio · 🎮 Jogos · 🧠 Quiz<br>📸 Fotos no Telão · 🎨 Vire Cartoon IA</p>' +
        '<p class="c-url">festalucas.roberto.inf.br</p>' +
      '</article>';
  }
  document.getElementById('folha').innerHTML = html;
})();
</script>
</body>
</html>
