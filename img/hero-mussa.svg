<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-label="Palco Street Cartoon do Mussa com microfone dourado, boombox e holofotes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221238"/>
      <stop offset="55%" stop-color="#4A175E"/>
      <stop offset="100%" stop-color="#E62E2D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="50%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#D49B00"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFD23F" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#FFD23F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo palco -->
  <rect width="600" height="680" rx="44" fill="url(#bg)"/>
  <ellipse cx="300" cy="250" rx="280" ry="240" fill="url(#spot)"/>

  <!-- Holofotes -->
  <polygon points="40,0 160,0 320,680 120,680" fill="#FFFFFF" opacity=".07"/>
  <polygon points="440,0 560,0 480,680 280,680" fill="#FFD23F" opacity=".08"/>

  <!-- Grade urbana / tijolinhos estilizados -->
  <g stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3">
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="0" y1="585" x2="600" y2="585"/>
    <line x1="0" y1="630" x2="600" y2="630"/>
  </g>

  <!-- Barra estilo YouTube no topo -->
  <rect x="34" y="28" width="532" height="44" rx="22" fill="#151524" stroke="#FFD23F" stroke-width="4"/>
  <rect x="52" y="38" width="44" height="24" rx="7" fill="#E62E2D"/>
  <polygon points="70,44 70,56 82,50" fill="#FFFFFF"/>
  <text x="112" y="57" font-family="'Baloo 2', Arial, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">MUSSA STYLE • LUCAS 7 ANOS</text>

  <!-- Estrelas e notas -->
  <g fill="#FFD23F">
    <polygon points="88,150 96,170 118,172 101,185 106,206 88,195 70,206 75,185 58,172 80,170"/>
    <polygon points="512,135 518,150 534,152 522,162 526,178 512,169 498,178 502,162 490,152 506,150"/>
  </g>
  <text x="56" y="320" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="#1CC6E8" opacity=".85">♪</text>
  <text x="506" y="310" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#FFD23F" opacity=".9">♫</text>

  <!-- Boombox atrás no palco -->
  <g transform="translate(86,472)">
    <rect x="0" y="18" width="428" height="122" rx="22" fill="#181826" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M126 18 V0 H302 V18" fill="none" stroke="#FFD23F" stroke-width="10" stroke-linecap="round"/>
    <circle cx="84" cy="79" r="42" fill="#2A2A40" stroke="#FFD23F" stroke-width="5"/>
    <circle cx="84" cy="79" r="18" fill="#E62E2D"/>
    <circle cx="344" cy="79" r="42" fill="#2A2A40" stroke="#FFD23F" stroke-width="5"/>
    <circle cx="344" cy="79" r="18" fill="#E62E2D"/>
    <rect x="156" y="42" width="116" height="44" rx="10" fill="#1CC6E8" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="170" y="56" width="18" height="16" rx="3" fill="#181826"/>
    <rect x="196" y="50" width="18" height="22" rx="3" fill="#FFD23F"/>
    <rect x="222" y="54" width="18" height="18" rx="3" fill="#E62E2D"/>
    <rect x="248" y="48" width="14" height="24" rx="3" fill="#3EC96B"/>
    <rect x="168" y="100" width="92" height="14" rx="7" fill="#FFD23F"/>
  </g>

  <!-- Personagem estilo Mussa Cartoon no centro -->
  <g transform="translate(300,320)">
    <!-- Moletom vermelho -->
    <path d="M-112 165 C-112 96 -62 68 0 68 C62 68 112 96 112 165 L120 218 L-120 218 Z" fill="#E62E2D" stroke="#181826" stroke-width="9" stroke-linejoin="round"/>
    <!-- Corrente dourada com M -->
    <path d="M-48 84 Q0 142 48 84" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="134" r="24" fill="url(#gold)" stroke="#181826" stroke-width="6"/>
    <text x="0" y="143" text-anchor="middle" font-family="'Baloo 2', Arial, sans-serif" font-weight="800" font-size="28" fill="#181826">M</text>

    <!-- Pescoço -->
    <rect x="-26" y="42" width="52" height="36" rx="14" fill="#F2B88B" stroke="#181826" stroke-width="7"/>

    <!-- Cabeça -->
    <ellipse cx="0" cy="-26" rx="86" ry="90" fill="#F2B88B" stroke="#181826" stroke-width="8"/>

    <!-- Orelhas -->
    <circle cx="-86" cy="-18" r="18" fill="#F2B88B" stroke="#181826" stroke-width="7"/>
    <circle cx="86" cy="-18" r="18" fill="#F2B88B" stroke="#181826" stroke-width="7"/>

    <!-- Barba longa estilizada (marca registrada!) -->
    <path d="M-78 -14 C-82 48 -46 92 0 98 C46 92 82 48 78 -14 C64 4 46 14 28 16 C18 8 -18 8 -28 16 C-46 14 -64 4 -78 -14 Z" fill="#181826" stroke="#181826" stroke-width="6" stroke-linejoin="round"/>
    <!-- Sorriso -->
    <path d="M-30 24 Q0 48 30 24 Z" fill="#FFFFFF" stroke="#181826" stroke-width="4"/>

    <!-- Pano / Bandana na cabeça -->
    <path d="M-90 -56 Q0 -82 90 -56 L84 -32 Q0 -52 -84 -32 Z" fill="#FFFFFF" stroke="#181826" stroke-width="7"/>
    <path d="M-70 -50 L-50 -44 M-20 -58 L0 -54 M30 -54 L54 -48" stroke="#E62E2D" stroke-width="5" stroke-linecap="round"/>

    <!-- Boné vermelho virado para trás -->
    <path d="M-84 -60 C-78 -134 78 -134 84 -60 Z" fill="#E62E2D" stroke="#181826" stroke-width="8"/>
    <!-- Aba virada para o lado/trás -->
    <path d="M62 -76 L132 -62 C136 -50 124 -40 108 -42 L74 -52 Z" fill="#B31B1B" stroke="#181826" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="-118" r="10" fill="#FFD23F" stroke="#181826" stroke-width="5"/>

    <!-- Óculos escuros icônicos -->
    <g transform="translate(0,-20)">
      <rect x="-74" y="-18" width="64" height="40" rx="12" fill="#151524" stroke="#FFD23F" stroke-width="6"/>
      <rect x="10" y="-18" width="64" height="40" rx="12" fill="#151524" stroke="#FFD23F" stroke-width="6"/>
      <line x1="-10" y1="-2" x2="10" y2="-2" stroke="#FFD23F" stroke-width="7"/>
      <line x1="-60" y1="-8" x2="-40" y2="10" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".6"/>
      <line x1="24" y1="-8" x2="44" y2="10" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".6"/>
    </g>

    <!-- Microfone dourado na mão direita -->
    <g transform="translate(124,62) rotate(-18)">
      <rect x="-11" y="18" width="22" height="72" rx="9" fill="#181826" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="0" cy="0" r="28" fill="url(#gold)" stroke="#181826" stroke-width="6"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#181826" stroke-width="5"/>
      <circle cx="-8" cy="-10" r="4" fill="#FFF8CC"/>
    </g>
  </g>
</svg>
