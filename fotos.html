<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#140928">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>📸 Fotos dos Inscritos — Lucas Nery faz 7! 🎤</title>
<meta name="description" content="Galeria colaborativa da festa de 7 anos do Lucas Nery. Envie suas fotos direto do celular!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tema-mussa.css">
<style>
body{min-height:100svh;padding-bottom:3.5rem}
.topo{
  max-width:1060px;margin:0 auto;padding:1.4rem 1.1rem 1rem;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;
}
.voltar{
  font-family:var(--display);font-weight:800;font-size:.95rem;
  color:var(--grafite);background:var(--ouro);text-decoration:none;
  border:3px solid var(--grafite);border-radius:99px;padding:.4rem 1.05rem;
  box-shadow:0 4px 0 var(--grafite);
}
.nav-mini{display:flex;gap:.45rem;flex-wrap:wrap}
.nav-mini a{
  font-family:var(--display);font-weight:700;font-size:.82rem;
  color:var(--branco);background:rgba(21,21,36,.72);text-decoration:none;
  border:2px solid rgba(255,255,255,.35);border-radius:99px;padding:.28rem .75rem;
}
.hero-pag{
  text-align:center;color:var(--branco);
  max-width:760px;margin:0 auto;padding:.4rem 1.1rem 1.6rem;
}
.hero-pag h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(2rem,8.5vw,3.4rem);line-height:1;
  text-shadow:0 5px 0 var(--grafite);margin:.4rem 0;
}
.hero-pag p{font-weight:700;font-size:1.05rem;opacity:.95}

.wrap{max-width:1060px;margin:0 auto;padding:0 1.1rem}
.card-envio{
  background:linear-gradient(160deg, rgba(32,22,56,.90), rgba(16,14,32,.95));
  color:var(--branco);
  border:3.5px solid var(--rosa);border-radius:30px;
  padding:1.6rem 1.4rem;margin-bottom:2rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.16), 0 10px 0 var(--grafite-escuro), 0 24px 44px rgba(0,0,0,.54), 0 0 34px rgba(244,78,139,.22);
}
.envio-grade{display:grid;grid-template-columns:1fr;gap:1rem;align-items:end}
@media (min-width:680px){.envio-grade{grid-template-columns:1fr auto}}
.campo label{display:block;font-family:var(--display);font-weight:800;margin-bottom:.3rem;color:var(--ouro)}
.campo input{
  width:100%;font-family:var(--texto);font-size:1rem;font-weight:700;
  color:var(--branco);background:rgba(12,10,24,.78);
  border:2.5px solid rgba(255,210,63,.55);border-radius:16px;padding:.72rem .95rem;
}
.campo input::placeholder{color:rgba(255,253,247,.5)}
.campo input:focus{outline:3px solid var(--ouro);border-color:var(--ouro)}
#inputFotos{display:none}
.fila{margin-top:1rem;display:flex;flex-direction:column;gap:.55rem}
.fila-item{
  background:rgba(255,210,63,.14);color:var(--creme);border:2px solid var(--ouro);border-radius:14px;
  padding:.55rem .85rem;font-size:.88rem;font-weight:800;
}
.barra{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:.35rem}
.barra > span{display:block;height:100%;width:0;background:var(--ouro);transition:width .2s ease}

.galeria-head{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  color:var(--branco);margin-bottom:1.1rem;flex-wrap:wrap;
}
.galeria-head h2{font-family:var(--display);font-weight:800;font-size:1.75rem;text-shadow:0 3px 0 var(--grafite-escuro)}
.contagem{
  font-family:var(--display);font-weight:800;font-size:.9rem;
  background:var(--ouro);color:var(--grafite);
  border:3px solid var(--grafite);border-radius:99px;padding:.2rem .8rem;
}
.btn-atualiza{
  font-family:var(--display);font-weight:800;font-size:.88rem;
  background:rgba(21,15,42,.85);color:var(--ouro);
  border:2.5px solid var(--ouro);border-radius:99px;padding:.35rem .95rem;
}
.grade-fotos{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;
}
@media (min-width:640px){.grade-fotos{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.foto-card{
  position:relative;background:rgba(24,18,44,.92);
  border:3px solid rgba(255,210,63,.55);border-radius:22px;overflow:hidden;
  box-shadow:0 7px 0 var(--grafite-escuro), 0 16px 30px rgba(0,0,0,.48);
  cursor:pointer;transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.foto-card:hover{transform:translateY(-5px);border-color:var(--ouro);box-shadow:0 12px 0 var(--grafite-escuro), 0 22px 36px rgba(0,0,0,.58), 0 0 24px rgba(255,210,63,.25)}
.foto-card img{
  width:100%;aspect-ratio:1;object-fit:cover;
  pointer-events:none;-webkit-touch-callout:none;user-select:none;
}
.foto-autor{
  font-family:var(--display);font-weight:800;font-size:.84rem;
  padding:.46rem .75rem;background:rgba(16,12,30,.95);color:var(--ouro);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.vazio{
  grid-column:1/-1;text-align:center;color:var(--branco);
  background:rgba(21,21,36,.65);border:3px dashed var(--ouro);
  border-radius:24px;padding:2.2rem 1.2rem;font-weight:800;
}

/* Lightbox com 5 molduras temáticas Mussa */
.lightbox{
  position:fixed;inset:0;z-index:100;
  background:rgba(13,13,22,.9);backdrop-filter:blur(8px);
  display:none;place-items:center;padding:1.2rem;
}
.lightbox.aberto{display:grid}
.lb-moldura{
  position:relative;max-width:min(92vw,760px);max-height:86vh;
  background:var(--creme);border:8px solid var(--ouro);border-radius:28px;
  padding:.8rem;box-shadow:0 12px 0 var(--grafite), 0 30px 60px rgba(0,0,0,.65);
  display:flex;flex-direction:column;align-items:center;
}
.lb-moldura.m-0{border-color:var(--vermelho);background:#FFF5F5}
.lb-moldura.m-1{border-color:var(--ouro);background:#FFFBEA}
.lb-moldura.m-2{border-color:var(--ciano);background:#F0FCFF}
.lb-moldura.m-3{border-color:var(--roxo);background:#F6F0FF}
.lb-moldura.m-4{border-color:var(--rosa);background:#FFF0F6}
.lb-img-wrap{position:relative;overflow:hidden;border-radius:18px;border:4px solid var(--grafite)}
.lb-img-wrap img{
  max-width:100%;max-height:68vh;object-fit:contain;display:block;
  -webkit-touch-callout:none;user-select:none;pointer-events:none;
}
.lb-escudo{position:absolute;inset:0;z-index:2}
.lb-legenda{
  font-family:var(--display);font-weight:800;font-size:1rem;
  color:var(--grafite);margin-top:.6rem;text-align:center;
}
.lb-btn{
  position:fixed;background:var(--ouro);color:var(--grafite);
  border:3px solid var(--grafite);border-radius:50%;
  width:48px;height:48px;font-size:1.3rem;font-weight:900;
  display:grid;place-items:center;box-shadow:0 4px 0 var(--grafite);z-index:110;
}
.lb-fechar{top:16px;right:16px}
.lb-ant{left:14px;top:50%;transform:translateY(-50%)}
.lb-prox{right:14px;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>
<header class="topo">
  <a class="voltar" href="index.html?festa=1">← Início</a>
  <nav class="nav-mini" aria-label="Outras páginas da festa">
    <a href="cardapio.html">🍽️ Cardápio</a>
    <a href="jogos.html">🎮 Arena de Jogos</a>
    <a href="capsula.html">📼 Cápsula</a>
    <a href="mussa.html">🎨 Mussaverso IA</a>
  </nav>
</header>

<section class="hero-pag">
  <p style="font-family:var(--display);font-weight:800;color:var(--ouro);letter-spacing:.08em">BASTIDORES DO SHOW · LUCAS NERY 7 ANOS</p>
  <h1>📸 Fotos dos Inscritos</h1>
  <p>Suba suas fotos direto do celular e monte o álbum oficial da Tropa do Lucas em tempo real!</p>
</section>

<main class="wrap">
  <section class="card-envio" aria-label="Enviar fotos">
    <div class="envio-grade">
      <div class="campo">
        <label for="campoNome">Seu nome (aparece na legenda da foto)</label>
        <input id="campoNome" type="text" maxlength="60" placeholder="Ex.: Tio Bruno, Mãe do Pedro...">
      </div>
      <div>
        <input id="inputFotos" type="file" accept="image/*" multiple>
        <button class="cta cta--fotos" id="btnEscolher" type="button">Escolher fotos 📸</button>
      </div>
    </div>
    <div class="fila" id="fila" aria-live="polite"></div>
  </section>

  <section aria-label="Galeria da festa">
    <div class="galeria-head">
      <div style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap">
        <h2>Mural da Festa 🔥</h2>
        <span class="contagem" id="contagem" hidden>0 fotos</span>
      </div>
      <button class="btn-atualiza" id="btnAtualiza" type="button">↺ Atualizar</button>
    </div>
    <div class="grade-fotos" id="gradeFotos">
      <div class="vazio">Carregando o mural da Tropa... 📸</div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="lb-btn lb-fechar" id="lbFechar" type="button" aria-label="Fechar">✕</button>
  <button class="lb-btn lb-ant" id="lbAnt" type="button" aria-label="Foto anterior">‹</button>
  <button class="lb-btn lb-prox" id="lbProx" type="button" aria-label="Próxima foto">›</button>
  <div class="lb-moldura m-0" id="lbMoldura">
    <div class="lb-img-wrap">
      <img id="lbImg" src="" alt="">
      <div class="lb-escudo" oncontextmenu="return false"></div>
    </div>
    <p class="lb-legenda" id="lbLegenda"></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  // Cloudinary — valores públicos (preset unsigned festa_lucas + tag festa-lucas)
  var CLOUD_NAME = 'znbneca7';
  var UPLOAD_PRESET = 'festa_lucas';
  var TAG = 'festa_lucas';
  var UPLOAD_URL = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload';
  var LIST_URL = '/api/galeria?pasta=' + TAG;
  var BASE_IMG = 'https://res.cloudinary.com/' + CLOUD_NAME + '/image/upload/';
  var MARCA = 'l_text:Arial_28_bold:Festa%20Lucas%20Nery%20-%207%20anos%20(2026),co_rgb:FFFFFF,o_70,g_south_east,x_24,y_20';

  var campoNome = document.getElementById('campoNome');
  var inputFotos = document.getElementById('inputFotos');
  var btnEscolher = document.getElementById('btnEscolher');
  var fila = document.getElementById('fila');
  var grade = document.getElementById('gradeFotos');
  var contagem = document.getElementById('contagem');
  var btnAtualiza = document.getElementById('btnAtualiza');
  var lightbox = document.getElementById('lightbox');
  var lbMoldura = document.getElementById('lbMoldura');
  var lbImg = document.getElementById('lbImg');
  var lbLegenda = document.getElementById('lbLegenda');
  var toast = document.getElementById('toast');

  var fotos = [];
  var locais = [];
  var idxAtual = 0;
  var toastTimer = null;

  function mostraToast(msg, ms) {
    toast.textContent = msg;
    toast.classList.add('mostra');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('mostra'); }, ms || 2800);
  }

  try { campoNome.value = localStorage.getItem('festa-lucas-nome') || ''; } catch (e) {}
  campoNome.addEventListener('change', function () {
    try { localStorage.setItem('festa-lucas-nome', campoNome.value.trim()); } catch (e) {}
  });

  btnEscolher.addEventListener('click', function () { inputFotos.click(); });

  function comprimir(arquivo) {
    return new Promise(function (resolve) {
      var img = new Image();
      var url = URL.createObjectURL(arquivo);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var max = 1600;
        var w = img.naturalWidth, h = img.naturalHeight;
        if (w > max || h > max) {
          var r = Math.min(max / w, max / h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function (blob) {
          resolve(blob && blob.size < arquivo.size ? blob : arquivo);
        }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(arquivo); };
      img.src = url;
    });
  }

  function enviarArquivo(arquivo) {
    var nome = campoNome.value.trim() || 'Convidado da Tropa';
    try { localStorage.setItem('festa-lucas-nome', nome); } catch (e) {}

    var item = document.createElement('div');
    item.className = 'fila-item';
    item.innerHTML = '<span>Enviando ' + arquivo.name.replace(/</g, '&lt;') + '...</span><div class="barra"><span></span></div>';
    fila.appendChild(item);
    var barra = item.querySelector('.barra > span');

    comprimir(arquivo).then(function (blob) {
      var fd = new FormData();
      fd.append('file', blob, arquivo.name);
      fd.append('upload_preset', UPLOAD_PRESET);
      fd.append('tags', TAG);
      fd.append('context', 'caption=' + nome.replace(/[|=]/g, ' '));

      var xhr = new XMLHttpRequest();
      xhr.open('POST', UPLOAD_URL);
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) barra.style.width = Math.round((e.loaded / e.total) * 100) + '%';
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          var res = JSON.parse(xhr.responseText);
          barra.style.width = '100%';
          barra.style.background = '#3EC96B';
          item.querySelector('span').textContent = '✅ Enviada!';
          locais.unshift({
            public_id: res.public_id,
            version: res.version,
            autor: nome,
            expira: Date.now() + 120000
          });
          try { localStorage.setItem('festa-lucas-carimbo-foto', '1'); } catch (e2) {}
          render(fotos);
          mostraToast('📸 Foto publicada! Carimbo conquistado no Passaporte!', 3400);
          setTimeout(function () { item.remove(); }, 2500);
        } else {
          item.querySelector('span').textContent = '❌ Erro no envio (verifique preset festa_lucas no Cloudinary)';
        }
      };
      xhr.onerror = function () { item.querySelector('span').textContent = '❌ Falha de rede ao enviar.'; };
      xhr.send(fd);
    });
  }

  inputFotos.addEventListener('change', function () {
    Array.prototype.slice.call(inputFotos.files || []).forEach(enviarArquivo);
    inputFotos.value = '';
  });

  function hashMoldura(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
    return Math.abs(h) % 5;
  }

  function urlThumb(f) {
    return BASE_IMG + 'c_fill,w_420,h_420,g_auto,q_auto,f_auto/v' + f.version + '/' + f.public_id + '.jpg';
  }
  function urlGrande(f) {
    return BASE_IMG + 'c_limit,w_1600,h_1600,q_auto,f_auto/' + MARCA + '/v' + f.version + '/' + f.public_id + '.jpg';
  }

  function listaCombinada(remotas) {
    var agora = Date.now();
    locais = locais.filter(function (l) { return l.expira > agora; });
    var mapa = {};
    var saida = [];
    locais.concat(remotas).forEach(function (f) {
      if (!mapa[f.public_id]) { mapa[f.public_id] = true; saida.push(f); }
    });
    return saida;
  }

  function render(remotas) {
    var lista = listaCombinada(remotas);
    contagem.hidden = false;
    contagem.textContent = lista.length + (lista.length === 1 ? ' foto' : ' fotos');
    if (!lista.length) {
      grade.innerHTML = '<div class="vazio">Ainda não há fotos no mural — seja o primeiro da Tropa a subir uma! 📸🎤</div>';
      return;
    }
    grade.innerHTML = '';
    lista.forEach(function (f, i) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'foto-card';
      card.innerHTML =
        '<img loading="lazy" src="' + urlThumb(f) + '" alt="Foto enviada por ' + f.autor.replace(/"/g, '&quot;') + '">' +
        '<div class="foto-autor">📷 ' + f.autor.replace(/</g, '&lt;') + '</div>';
      card.addEventListener('click', function () { abreLightbox(lista, i); });
      grade.appendChild(card);
    });
  }

  var listaAtualLb = [];
  function abreLightbox(lista, i) {
    listaAtualLb = lista;
    idxAtual = i;
    atualizaLb();
    lightbox.classList.add('aberto');
  }
  function atualizaLb() {
    var f = listaAtualLb[idxAtual];
    if (!f) return;
    lbMoldura.className = 'lb-moldura m-' + hashMoldura(f.public_id);
    lbImg.src = urlGrande(f);
    lbImg.alt = 'Foto de ' + f.autor;
    lbLegenda.textContent = '📷 ' + f.autor + ' · Festa Lucas Nery (7 anos)';
  }
  function fechaLb() { lightbox.classList.remove('aberto'); }

  document.getElementById('lbFechar').addEventListener('click', fechaLb);
  document.getElementById('lbAnt').addEventListener('click', function () {
    idxAtual = (idxAtual - 1 + listaAtualLb.length) % listaAtualLb.length;
    atualizaLb();
  });
  document.getElementById('lbProx').addEventListener('click', function () {
    idxAtual = (idxAtual + 1) % listaAtualLb.length;
    atualizaLb();
  });
  lightbox.addEventListener('click', function (e) { if (e.target === lightbox) fechaLb(); });
  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('aberto')) return;
    if (e.key === 'Escape') fechaLb();
    if (e.key === 'ArrowLeft') document.getElementById('lbAnt').click();
    if (e.key === 'ArrowRight') document.getElementById('lbProx').click();
  });

  function carregar() {
    var buster = Math.floor(Date.now() / 15000);
    fetch(LIST_URL + '&t=' + buster)
      .then(function (r) {
        if (r.status === 404) return { resources: [] };
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        fotos = (data.resources || []).map(function (r) {
          var autor = (r.context && r.context.custom && r.context.custom.caption) || 'Tropa do Lucas';
          return { public_id: r.public_id, version: r.version, autor: autor };
        });
        render(fotos);
      })
      .catch(function () {
        render(fotos);
      });
  }

  btnAtualiza.addEventListener('click', function () { carregar(); mostraToast('Mural atualizado! 📸', 1800); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) carregar(); });
  carregar();
  setInterval(carregar, 45000);
})();
</script>
<script src="js/palco-bg.js"></script>
</body>
</html>
